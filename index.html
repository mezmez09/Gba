<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>GBA Player</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui,sans-serif}
  #menu{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;box-sizing:border-box}
  h1{margin:0 0 4px;font-size:26px}
  p{margin:0;color:#aaa;max-width:34em;line-height:1.4}
  button,label.btn{background:#2a6df4;color:#fff;border:0;border-radius:10px;padding:14px 26px;font-size:18px;cursor:pointer;display:inline-block}
  button.sec,label.btn.sec{background:#333}
  button.danger{background:#7a2323;font-size:14px;padding:8px 14px}
  input[type=file]{display:none}
  #status{min-height:1.4em;color:#8fd18f}
  #status.err{color:#f08a8a}
  #game{width:100%;height:100%;display:none}
</style>
</head>
<body>
<div id="menu">
  <h1>GBA Player</h1>
  <p id="info">Pick your .gba file (or the .zip it came in) once. It is saved inside this browser, so next time you just tap Play.</p>
  <button id="play" style="display:none">▶ Play</button>
  <label class="btn sec" for="rom" id="pickLabel">Choose ROM file</label>
  <input type="file" id="rom" accept=".gba,.zip,.7z,.gb,.gbc">
  <p id="status"></p>
  <button class="danger" id="forget" style="display:none">Remove saved ROM</button>
</div>
<div id="game"></div>

<script>
// ---- Offline support: service worker caches the player + emulator files ----
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ---- Tiny IndexedDB helper to remember the ROM ----
const DB = 'gba-player', STORE = 'roms';
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbGet(k){const d=await openDb();return new Promise((res,rej)=>{const q=d.transaction(STORE).objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function dbSet(k,v){const d=await openDb();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function dbDel(k){const d=await openDb();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}

const $ = id => document.getElementById(id);
const status = (t,err)=>{$('status').textContent=t;$('status').className=err?'err':'';};
let saved = null;

async function refresh(){
  try{ saved = await dbGet('rom'); }catch(e){ saved = null; }
  $('play').style.display = saved ? 'inline-block' : 'none';
  $('forget').style.display = saved ? 'inline-block' : 'none';
  $('pickLabel').textContent = saved ? 'Choose a different ROM' : 'Choose ROM file';
  if (saved) $('info').textContent = 'Saved game: ' + saved.name;
}

$('rom').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f) return;
  status('Saving ROM…');
  try{
    await dbSet('rom',{name:f.name,type:f.type,blob:f});
    status('Saved! Tap Play.');
  }catch(err){ status('Could not store the ROM offline (will still play this time).',true); saved={name:f.name,blob:f}; }
  await refresh();
  if(!saved) saved={name:f.name,blob:f};
});
$('forget').addEventListener('click', async ()=>{ await dbDel('rom'); status('Removed.'); await refresh(); });

$('play').addEventListener('click', ()=>{
  if(!saved) return;
  const file = new File([saved.blob], saved.name, {type: saved.type || 'application/octet-stream'});
  $('menu').style.display='none';
  $('game').style.display='block';

  window.EJS_player      = '#game';
  window.EJS_core        = 'gba';
  window.EJS_gameUrl     = file;
  window.EJS_gameName    = saved.name.replace(/\.[^.]+$/,'');
  window.EJS_pathtodata  = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_threads     = false;
  window.EJS_cacheConfig = {enabled:true, cacheMaxSizeMB:4096, cacheMaxAgeMins:525600};

  const s = document.createElement('script');
  s.src = window.EJS_pathtodata + 'loader.js';
  s.onerror = ()=>{ $('game').style.display='none'; $('menu').style.display='flex';
    status('Could not load the emulator. Connect to the internet and open this page once, then it works offline.',true); };
  document.body.appendChild(s);
});

refresh();
</script>
</body>
</html>
